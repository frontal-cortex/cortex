# Every PR and every push to main: the same three checks a contributor runs
# locally before committing (see docs/development.md), plus clippy.
name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  check:
    name: Test, typecheck, build
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install JS dependencies
        run: npm ci --legacy-peer-deps --no-audit --no-fund

      - name: cargo test --workspace
        run: cargo test --workspace

      - name: Pure TypeScript helpers
        run: npm run test:lib

      - name: npx tsc --noEmit
        run: npx tsc --noEmit

      - name: npx vite build
        run: npx vite build

      # The tree still carries a handful of clippy warnings, so this step only
      # reports for now. Once `cargo clippy --workspace --all-targets` is clean,
      # append `-- -D warnings` and drop `continue-on-error`.
      - name: cargo clippy
        run: cargo clippy --workspace --all-targets
        continue-on-error: true
