# Push a tag `v<version>` (matching `version` in src-tauri/tauri.conf.json) and
# this builds Cortex for Linux, macOS (Apple silicon + Intel) and Windows, then
# publishes a draft GitHub release carrying the installers, their signatures
# and the updater manifest (`latest.json`) that the in-app "Check for updates"
# reads. Publishing the draft is a manual step, on purpose.
#
# Secrets (repository → Settings → Secrets and variables → Actions):
#   TAURI_SIGNING_PRIVATE_KEY          the updater signing key (see docs/development.md)
#   TAURI_SIGNING_PRIVATE_KEY_PASSWORD its password
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  build:
    name: Build ${{ matrix.platform }} ${{ matrix.args }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: --target aarch64-apple-darwin
          - platform: macos-latest
            args: --target x86_64-apple-darwin
          - platform: ubuntu-22.04
            args: ''
          - platform: windows-latest
            args: ''
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Tauri system dependencies (Linux)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - uses: dtolnay/rust-toolchain@stable
        with:
          # macOS builds cross-compile for the other architecture.
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.args }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install JS dependencies
        run: npm ci --legacy-peer-deps --no-audit --no-fund

      - name: Build bundles and publish the draft release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: Cortex ${{ github.ref_name }}
          releaseBody: See the assets below to download and install this version. Existing installs can update in-app (Check for updates).
          releaseDraft: true
          prerelease: false
          includeUpdaterJson: true
          # tauri.release.conf.json turns on updater artifacts (signed
          # bundles + latest.json); a local `npm run tauri build` stays
          # unsigned and needs no key.
          args: ${{ matrix.args }} --config src-tauri/tauri.release.conf.json
