<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="512" y1="100" x2="512" y2="924" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#13203a"/>
      <stop offset="0.55" stop-color="#0a1124"/>
      <stop offset="1" stop-color="#060912"/>
    </linearGradient>
    <radialGradient id="glow" cx="512" cy="470" r="360" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#3a6fd6" stop-opacity="0.55"/>
      <stop offset="0.55" stop-color="#274a93" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#274a93" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="stroke" x1="350" y1="200" x2="674" y2="820" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#9cc1ff"/>
    </linearGradient>
    <radialGradient id="halo" cx="512" cy="500" r="300" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#bcd6ff" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#bcd6ff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- squircle base -->
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#bg)"/>
  <!-- inner blue glow -->
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#glow)"/>

  <!-- faint neural nodes -->
  <g fill="#9fc0ff">
    <circle cx="300" cy="300" r="6" opacity="0.5"/>
    <circle cx="730" cy="330" r="5" opacity="0.4"/>
    <circle cx="250" cy="640" r="5" opacity="0.4"/>
    <circle cx="760" cy="680" r="6" opacity="0.5"/>
    <circle cx="360" cy="780" r="4" opacity="0.35"/>
    <circle cx="660" cy="780" r="4" opacity="0.35"/>
  </g>

  <!-- soft halo behind the brain -->
  <circle cx="512" cy="500" r="300" fill="url(#halo)"/>

  <!-- brain glyph (24x24 source, scaled & centered) -->
  <g transform="translate(183,197) scale(27.4)" fill="none" stroke="url(#stroke)" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">
