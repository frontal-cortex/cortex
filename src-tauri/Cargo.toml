[package]
name = "second-brain"
version = "0.1.0"
description = "A local-first second brain"
authors = []
edition = "2021"

[lib]
name = "second_brain_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
thiserror = "2"

# Git operations
git2 = { version = "0.19", default-features = false, features = ["vendored-openssl"] }

# SQLite for local index
rusqlite = { version = "0.32", features = ["bundled"] }

# Frontmatter / YAML
serde_yaml = "0.9"

# File traversal
walkdir = "2"

# Base64 for asset binary upload
base64 = "0.22"
pulldown-cmark = "0.12"

# Filesystem watcher (external edits, agents, git checkouts → live UI)
notify = "8"
