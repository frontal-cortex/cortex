[package]
name = "second-brain"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "A local-first second brain"

[lib]
name = "second_brain_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-shell = "2"
cortex-core.workspace = true
cortex-app = { workspace = true, features = ["server"] }
# QR code of the tailnet address in Settings → Serve to my devices
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
serde.workspace = true
serde_json.workspace = true

# Clipboard images for the Wayland paste fallback
base64 = "0.22"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-process = "2"
tauri-plugin-updater = "2"
