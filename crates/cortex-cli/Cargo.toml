[package]
name = "cortex-cli"
description = "cortex — the command-line face of a Cortex vault, for people and agents"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "cortex"
path = "src/main.rs"

[dependencies]
cortex-core.workspace = true
# `cortex serve`: the application layer with its HTTP host
cortex-app = { workspace = true, features = ["server"] }
serde.workspace = true
serde_json.workspace = true
serde_yaml.workspace = true
clap = { version = "4", features = ["derive", "env"] }
chrono.workspace = true
rmcp = { version = "3", features = ["server", "transport-io", "macros"] }
tokio = { version = "1", features = ["rt-multi-thread", "io-std", "macros", "signal"] }
