format: 1
id: nutrition
name: "Nutrition"
version: 1.0.0
kind: collection
summary: "Calories, protein and fibre against a daily target, from a food list you build once."
description: |
  A dashboard over four small databases. `foods` is your own list, each food carrying the macros of one serving — whatever you decide a serving is, a packet's 100 g or one slice. `food-log` is a row per thing eaten: the food, how many servings, which meal. The calories, protein, carbs, fat and fibre of a row are the food's numbers times the servings, so a macro is typed once and never again, and correcting a food corrects every meal you ever logged it in. `nutrition-targets` is what you are aiming at in a day — tick `active` on the row in use and keep the others for days that are meant to be different. `weigh-ins` is the feedback: a calorie target is right when the weight goes where you meant it to. The dashboard answers the day rather than repeating it — how far through your calories, protein and fibre you are as three rings, what is left of each, today's rows with their totals, the seven-day averages against the target, two weeks of days as bars so a missed day is visible, the weekly weight line, and where the protein came from. Logging is a press: a meal button opens a row with the date filled in, or open a food you eat often and press the meal on its own page for one serving, logged. For something someone else cooked, leave the food empty and put in what you know.
tags: [health, food, nutrition, macros, diet, database, tracker]
author:
  name: "Cortex team"
  url: https://github.com/frontal-cortex
license: CC0-1.0
credits: "The shape — a food library with per-serving macros, a row per thing eaten with a quantity, and targets in grams rather than as a share of calories — follows what the dedicated apps (Cronometer, MacroFactor, MyFitnessPal) settled on and what the better Notion trackers get wrong. Protein and fibre guidance follows Morton et al. 2018, the ISSN position stand and the US dietary guidelines; seed macros are rounded from USDA FoodData Central. The computed-on-read model and the food page as a logging surface are our own."
min_cortex: 0.1.0
collection: nutrition
collections: [foods, food-log, nutrition-targets, weigh-ins]
