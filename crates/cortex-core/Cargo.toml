[package]
name = "cortex-core"
description = "The Cortex vault model: markdown notes, frontmatter, the SQLite index, collections, and git — shared by the app and the CLI"
version.workspace = true
edition.workspace = true
license.workspace = true
build = "build.rs"

[dependencies]
regex = "1"
serde.workspace = true
serde_json.workspace = true
serde_yaml.workspace = true
thiserror.workspace = true
# Today's date for scaffolded notes
chrono.workspace = true

# Git operations
git2 = { version = "0.19", default-features = false, features = ["vendored-openssl"] }

# SQLite for the local index
rusqlite = { version = "0.32", features = ["bundled"] }

# File traversal
walkdir = "2"

# Reading a Notion export zip (pure Rust: deflate via flate2's miniz_oxide backend)
zip = { version = "8", default-features = false, features = ["deflate-flate2"] }
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }

# Markdown → HTML for exports
pulldown-cmark = "0.12"

# Marketplace: pack hashes, versions, and fetching a remote index
sha2 = "0.10"
hex = "0.4"
semver = "1"
ureq = { version = "3", default-features = false, features = ["rustls", "gzip"] }
