[workspace]
resolver = "2"
members = ["crates/cortex-core", "crates/cortex-cli", "src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
cortex-core = { path = "crates/cortex-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
thiserror = "2"
chrono = "0.4"
